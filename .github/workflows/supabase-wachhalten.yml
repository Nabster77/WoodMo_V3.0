# WOODMO V3 – Supabase wachhalten
# Supabase pausiert Gratis-Projekte nach 7 Tagen ohne Datenbank-Aktivität.
# Dieser Ablauf stellt einmal am Tag eine kleine LESE-Abfrage an die V3-Datenbank.
# Er schreibt nichts, löscht nichts und ändert keine Tabelle (Backups bleiben einspielbar).
# Nur V3 (tulndunkpsynkbbebenf). V2 wird nie angesprochen.
name: Supabase wachhalten (V3)

on:
  schedule:
    - cron: '41 2 * * *'   # täglich 02:41 UTC = 03:41 Uhr Winterzeit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      V3_URL: https://tulndunkpsynkbbebenf.supabase.co
      CONFIG_URL: ${{ vars.VITE_SUPABASE_URL }}
      ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Sicherheitscheck – nur V3
        run: |
          if [ -z "$ANON_KEY" ]; then
            echo "Secret VITE_SUPABASE_ANON_KEY ist für diesen Ablauf nicht sichtbar."; exit 1
          fi
          if [ -n "$CONFIG_URL" ] && [ "${CONFIG_URL%/}" != "$V3_URL" ]; then
            echo "STOPP: Die hinterlegte Adresse ist nicht die V3-Datenbank."; exit 1
          fi
          case "$V3_URL" in *fsztsmnxbffanyfbytnr*) echo "STOPP: V2"; exit 1;; esac
      - name: Kleine Lese-Abfrage (1 Bon-ID, Inhalt wird nicht ausgegeben)
        run: |
          for try in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              "$V3_URL/rest/v1/pos_transactions?select=id&limit=1" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY") || code=000
            echo "Versuch $try: HTTP $code"
            case "$code" in 200|206) echo "Supabase V3 ist wach."; exit 0;; esac
            sleep 20
          done
          echo "Supabase V3 hat nicht geantwortet (pausiert oder gestört). Bitte im Supabase-Dashboard prüfen."
          exit 1
